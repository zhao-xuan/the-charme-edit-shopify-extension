# Public Product Studio app. Legacy single-store widget/Cart Transform code remains
# in the repo, but is deliberately excluded from this app version.
client_id = "93d071d516310e58e5eaeaf778d77e37"
name = "Charmé Product Studio"
application_url = "https://charme-customizer.pages.dev/shopify/"
embedded = true
extension_directories = ["extensions/charme-customizer-theme"]

[access_scopes]
# The merchant binds a Shopify variant after approving a design; the app reads
# its live contextual price before sending the customer to the native cart.
scopes = "read_products"
use_legacy_install_flow = false

[auth]
# Shopify-managed installation + App Bridge token exchange needs no callback.
redirect_urls = []

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
uri = "/webhooks/shopify"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "/webhooks/shopify"
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
