# This manifest mirrors the current Developer Dashboard app configuration.
# Keep the existing permissions and subscriptions when adding new scopes.
client_id = "93d071d516310e58e5eaeaf778d77e37"
extension_directories = ["extensions/charme-customizer-theme"]
name = "Charm customiser"
application_url = "https://charme-customizer.pages.dev/admin"
embedded = true

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
uri = "/webhooks/shopify"
topics = ["app/uninstalled", "orders/paid"]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[access_scopes]
# Existing dashboard scopes plus read_orders for the paid-order webhook.
scopes = "read_all_cart_transforms,read_cart_transforms,read_discounts,read_draft_orders,read_files,read_metaobject_definitions,read_metaobjects,read_orders,read_products,read_themes,write_cart_transforms,write_discounts,write_draft_orders,write_files,write_metaobject_definitions,write_metaobjects,write_products,write_themes"
use_legacy_install_flow = false
optional_scopes = []

[auth]
redirect_urls = []
