query RunInput {
  cart {
    lines {
      id
      quantity
      # Every line of one custom design carries the same _design_token property
      # (added by shopifyCart.js when adding base case + charms to the cart).
      designToken: attribute(key: "_design_token") {
        value
      }
    }
  }
  # The parent "Custom Charm Case" variant that represents the merged bundle
  # line. Stored as an app-owned shop metafield so the merchant can point it at
  # their product without a code change (set by activate-cart-transform.mjs).
  shop {
    parentVariant: metafield(namespace: "$app:charme", key: "parent_variant") {
      value
    }
  }
}
