<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Charmé Customizer — Shopify embed harness</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../public/widget/charme-customizer.css" />
    <style>
      body { margin: 0; font-family: Jost, sans-serif; background: #efe6d8; }
      .pdp { max-width: 1200px; margin: 0 auto; padding: 16px; }
      .pdp h1 { font-family: 'Cormorant Garamond', serif; }
    </style>
  </head>
  <body>
    <div class="pdp">
      <h1>Build your charm case — (Shopify embed harness)</h1>
      <div id="charme-customizer-root" style="min-height: 86vh"></div>
    </div>

    <!-- Mock a Dawn-style cart drawer so we can verify the drawer flow. -->
    <script>
      class MockCartDrawer extends HTMLElement {
        open() { window.__drawerOpened = (window.__drawerOpened || 0) + 1; this.classList.add('active') }
      }
      customElements.define('cart-drawer', MockCartDrawer)
      document.write('<div id="shopify-section-cart-drawer"><cart-drawer></cart-drawer></div>')
    </script>

    <script>
      // --- simulate the Shopify storefront environment ---
      window.Shopify = { routes: { root: '/' }, shop: 'demo.myshopify.com' }

      // inline config the drop-in section would render. apiBase points at the
      // Cloudflare Pages deployment that hosts the widget, catalogue + charm art.
      window.CharmeConfig = {
        apiBase: 'https://charme-customizer.pages.dev',
        mountId: 'charme-customizer-root',
        orderMode: 'cart',
        cartRedirect: 'drawer',
        defaultGroup: 'apple',
        defaultProductId: 'iphone-16-pro',
        variantMap: {
          products: { 'iphone-16-pro:white': 111, 'iphone-16-pro:black': 112 },
          // Price-point charms: every £2/£3/£5 charm maps to one generic variant.
          charmByPrice: { '2': 201, '3': 202, '5': 203 },
          charms: {},
        },
      }

      // mock /cart/add.js so "Add to bag" works without a real store
      const realFetch = window.fetch.bind(window)
      window.__lastCartAdd = null
      window.fetch = (url, opts) => {
        if (typeof url === 'string' && url.indexOf('/cart/add.js') !== -1) {
          window.__lastCartAdd = JSON.parse(opts.body)
          console.log('[harness] /cart/add.js items:', window.__lastCartAdd.items)
          return Promise.resolve(new Response(JSON.stringify({
            items: window.__lastCartAdd.items,
            sections: { 'cart-drawer': '<div id="shopify-section-cart-drawer"><cart-drawer></cart-drawer></div>' },
          }), { status: 200, headers: { 'Content-Type': 'application/json' } }))
        }
        return realFetch(url, opts)
      }
    </script>
    <script src="../public/widget/charme-customizer.js" defer></script>
  </body>
</html>
