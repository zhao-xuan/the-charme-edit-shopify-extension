<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // When Shopify opens this app embedded in the Admin it appends ?host/&shop.
      // App Bridge MUST be the first, SYNCHRONOUS script in <head> — it aborts if
      // loaded async/deferred — so we inject it via document.write during parse
      // (only when embedded). This makes window.shopify.idToken() available so the
      // admin can mint session tokens for authenticated writes. The public
      // storefront customizer (no host param) never hits this branch.
      (function () {
        try {
          var qs = new URLSearchParams(location.search)
          if (!(qs.has('host') || qs.has('shop') || qs.has('embedded'))) return
          window.__charmeEmbedded = true
          document.write(
            '<meta name="shopify-api-key" content="93d071d516310e58e5eaeaf778d77e37">',
          )
          document.write(
            '<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"><\/script>',
          )
        } catch (e) { /* ignore */ }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>The Charmé Edit · Design Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
