<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <script>
      // When Shopify opens this app embedded in the Admin, it appends ?host=/&shop=.
      // In that case (only) load App Bridge so the admin page can mint session
      // tokens. The public storefront customizer never hits this branch.
      (function () {
        try {
          var qs = new URLSearchParams(location.search)
          if (!(qs.has('host') || qs.has('shop') || qs.has('embedded'))) return
          window.__charmeEmbedded = true
          var meta = document.createElement('meta')
          meta.name = 'shopify-api-key'
          meta.content = '93d071d516310e58e5eaeaf778d77e37'
          document.head.appendChild(meta)
          var s = document.createElement('script')
          s.src = 'https://cdn.shopify.com/shopifycloud/app-bridge.js'
          document.head.appendChild(s)
        } catch (e) { /* ignore */ }
      })()
    </script>
    <title>The Charmé Edit · Design Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
