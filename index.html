<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // When Shopify opens this app embedded in the Admin it appends ?host/&shop.
      // App Bridge MUST be the first, SYNCHRONOUS script in <head> — it aborts if
      // loaded async/deferred — so we inject it via document.write during parse
      // (only when embedded). This makes window.shopify.idToken() available so the
      // admin can mint session tokens for authenticated writes. The public
      // storefront customizer (no host param) never hits this branch.
      (function () {
        try {
          var qs = new URLSearchParams(location.search)
          if (!(qs.has('host') || qs.has('embedded'))) return
          window.__charmeEmbedded = true
          document.write(
            '<meta name="shopify-api-key" content="93d071d516310e58e5eaeaf778d77e37">',
          )
          document.write(
            '<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"><\/script>',
          )
        } catch (e) { /* ignore */ }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>The Charmé Edit · Design Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Azeret+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <main id="charme-startup" role="status" aria-live="polite" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;background:#f7f1e8;color:#2e2a26;font:16px/1.5 system-ui,sans-serif;text-align:center">
        <strong>The Charmé Edit</strong>
        <span data-startup-message>Loading your design studio...</span>
        <button data-startup-reload type="button" hidden onclick="location.reload()" style="padding:12px 20px;border:1px solid currentColor;border-radius:8px;background:#12261d;color:#fff;font:inherit;cursor:pointer">Reload design studio</button>
        <noscript>Please enable JavaScript to open the design studio.</noscript>
      </main>
    </div>
    <script data-charme-startup>
      (function () {
        function startupFailed() {
          var startup = document.getElementById('charme-startup')
          if (!startup) return
          console.error('[Charmé] design studio startup stalled or failed')
          startup.setAttribute('role', 'alert')
          startup.querySelector('[data-startup-message]').textContent = 'The design studio could not load. Check your connection and try again.'
          startup.querySelector('[data-startup-reload]').hidden = false
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT' && event.target.type === 'module') startupFailed()
        }, true)
        window.addEventListener('vite:preloadError', startupFailed)
        setTimeout(startupFailed, 30000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
